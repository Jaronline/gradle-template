name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'microsoft' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || 25 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Lint
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon

  summary:
    name: CI Summary
    needs:
      - build
      - lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Build Result
        uses: Jaronline/.github/actions/check-job-or-step-result@3e223616de3238cb5fcbcffa93d8306bd5529295 # main
        with:
          result: ${{ needs.build.result }}
      - name: Check Lint Result
        uses: Jaronline/.github/actions/check-job-or-step-result@3e223616de3238cb5fcbcffa93d8306bd5529295 # main
        with:
          result: ${{ needs.lint.result }}