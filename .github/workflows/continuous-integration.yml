name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'microsoft' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || 25 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Check
        run: |
          chmod +x gradlew
          ./gradlew check

  gh-check:
    name: GitHub meta check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/workflows
      - name: Install GitHub CLI extensions
        run: gh extension install github/gh-actions-lock
      - name: Lock GitHub actions
        run: gh actions-lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect changes
        run: |
          if ! git diff --exit-code .github/workflows/actions.lock >/dev/null 2>&1; then
            echo ::error::Changes found in actions.lock. Please lock the actions using gh actions-lock!
            exit 1
          fi
          exit 0

  summary:
    name: CI Summary
    needs:
      - build
      - check
      - gh-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Build Result
        uses: Jaronline/.github/actions/check-job-or-step-result@main
        with:
          result: ${{ needs.build.result }}
      - name: Check Check Result
        uses: Jaronline/.github/actions/check-job-or-step-result@main
        with:
          result: ${{ needs.check.result }}
      - name: Check GH Check Result
        uses: Jaronline/.github/actions/check-job-or-step-result@main
        with:
          result: ${{ needs.gh-check.result }}