name: Release
run-name: Release ${{ inputs.project }}
on:
  workflow_dispatch:
    inputs:
      project:
        description: The project to release
        required: true
        type: choice
        options:
          - all
        default: all

permissions:
  id-token: write
  contents: write

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}|${{ inputs.project }}
  cancel-in-progress: true

env:
  JAVA_DISTRIBUTION: ${{ vars.JAVA_DISTRIBUTION || 'microsoft' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || 25 }}

jobs:
  determine-release-properties:
    runs-on: ubuntu-latest
    outputs:
      working-directory: ${{ steps.properties.outputs.working_directory }}
      gradle-project-prefix: ${{ steps.properties.outputs.gradle_project_prefix }}
      git-tag-prefix: ${{ steps.properties.outputs.git_tag_prefix }}
      git-commit-scope: ${{ steps.properties.outputs.git_commit_scope }}
    steps:
      - name: Determine properties
        id: properties
        run: |
          echo working_directory=${{ inputs.project == 'all' && '.' || inputs.project }} >> "$GITHUB_OUTPUT"
          echo gradle_project_prefix=${{ inputs.project == 'all' && '' || format(':{0}:', inputs.project) }} >> "$GITHUB_OUTPUT"
          echo git_tag_prefix=${{ inputs.project == 'all' && 'v' || format('{0}@', inputs.project) }} >> "$GITHUB_OUTPUT"
          echo git_commit_scope=${{ inputs.project == 'all' && '' || format('({0})', inputs.project) }} >> "$GITHUB_OUTPUT"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: determine-release-properties
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-tags: true
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Setup SSH Signing Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.SSH_SIGNING_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
        env:
          SSH_SIGNING_KEY: ${{ secrets.CI_SSH_SIGNING_KEY }}
      - name: Configure Git
        run: |
          git config --local user.email "${GITHUB_EMAIL}"
          git config --local user.name "${GITHUB_USER}"
          git config --local gpg.format ssh
          git config --local user.signingkey ~/.ssh/signing_key.pub
          git config --local commit.gpgsign true
          git config --local tag.gpgsign true
        env:
          GITHUB_USER: ${{ vars.CI_USER }}
          GITHUB_EMAIL: ${{ vars.CI_EMAIL }}
      - name: Get Next Version
        id: next_version
        run: |
          version="$(./gradlew ${{ needs.determine-release-properties.outputs.gradle-project-prefix }}properties --property=version -q | grep -Po '(?<=version: ).*')"
          echo version="$version" >> "$GITHUB_OUTPUT"
          echo tag="${{ needs.determine-release-properties.outputs.git-tag-prefix }}$version"
      - name: Check tag existence
        run: |
          if git rev-parse "${{ steps.next_version.outputs.tag }}" >/dev/null 2>&1; then
            echo ::error::Tag ${{ steps.next_version.outputs.tag }} already exists!
            exit 1
          fi
          exit 0
      - name: Patch changelog
        run: |
          ./gradlew ${{ needs.determine-release-properties.outputs.gradle-project-prefix }}patchChangelog
      - name: Check changes in CHANGELOG.md
        run: |
          if git diff --exit-code CHANGELOG.md >/dev/null 2>&1; then
            echo ::error::No changes found for release ${{ steps.next_version.outputs.version }}!
            exit 1
          fi
          exit 0
        working-directory: ${{ needs.determine-release-properties.outputs.working-directory }}
      - name: Get release notes
        run: |
          ./gradlew ${{ needs.determine-release-properties.outputs.gradle-project-prefix }}getChangelog --no-header --no-empty-sections --project-version=${{ steps.next_version.outputs.version }} --output-file=release-notes.md
      - name: Commit changelog
        run: |
          git add CHANGELOG.md
          git commit -m "chore${{ needs.determine-release-properties.outputs.git-commit-scope }}: release ${{ steps.next_version.outputs.tag }}"
          git pull --rebase origin main
          git push origin main
        working-directory: ${{ needs.determine-release-properties.outputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      - name: Create tag
        run: |
          git tag -s -m "${{ steps.next_version.outputs.tag }}" ${{ steps.next_version.outputs.tag }}
          git push --tags origin
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      - name: Create release
        run: |
          gh release create ${{ steps.next_version.outputs.tag }} --latest --notes-file release-notes.md --verify-tag
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
