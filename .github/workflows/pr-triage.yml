name: PR Triage
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  Labeler:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Label Pull Request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          sync-labels: true
